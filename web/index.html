<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>悉尼港 · 此间</title>
  <style>
    :root { --ink: #f4efe6; --panel: rgba(18, 22, 28, 0.62); --accent: #e8a35a; }
    html, body { margin: 0; height: 100%; background: #0d1116; overflow: hidden; font: 13px/1.4 system-ui, "Microsoft YaHei", sans-serif; color: var(--ink); }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .hud { position: fixed; left: 12px; top: 12px; display: grid; gap: 6px; }
    .row { display: flex; gap: 4px; align-items: center; }
    .row span { width: 38px; opacity: 0.7; }
    button { background: var(--panel); color: var(--ink); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
    button:hover { border-color: rgba(255,255,255,0.35); }
    button.on { background: var(--accent); color: #1a1208; border-color: var(--accent); }
    .hint, .stats, .credit { position: fixed; background: var(--panel); padding: 5px 9px; border-radius: 4px; }
    .hint { left: 12px; bottom: 12px; }
    .stats { right: 12px; top: 12px; font-variant-numeric: tabular-nums; white-space: pre; }
    .credit { right: 12px; bottom: 12px; max-width: 34vw; text-align: right; opacity: 0.75; font-size: 11px; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; letter-spacing: 0.1em; background: #0d1116; z-index: 5; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="loading">载入悉尼港…</div>
  <div class="hud">
    <div class="row"><span>光线</span>
      <button data-time="day">白天</button><button data-time="golden" class="on">黄金时段</button><button data-time="blue">蓝调</button>
    </div>
    <div class="row"><span>机位</span>
      <button data-view="spawn" class="on">码头</button><button data-view="bridge">桥下</button><button data-view="fly">自由飞行</button>
    </div>
  </div>
  <div class="hint">按住鼠标拖动环视 · WASD 行走 · Shift 快走 · 自由飞行时 Q/E 升降</div>
  <div class="stats" id="stats"></div>
  <div class="credit" id="credit"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
