<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>此间 · 拍照测试</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1a17; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .hud {
    position: fixed; left: 16px; top: 14px; z-index: 10; color: #eee8dc; font: 14px/1.7 "Songti SC", serif;
    background: rgba(29, 26, 23, 0.55); padding: 10px 14px; border-radius: 4px; max-width: 360px;
  }
  .hud b { color: #fff; }
  .hud button { font: inherit; margin: 6px 6px 0 0; padding: 2px 10px; cursor: pointer; background: #eee8dc; border: 0; border-radius: 3px; }
  .hud button.on { background: #b23428; color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%); z-index: 40; color: #fff; background: rgba(0,0,0,.7); padding: 8px 16px; border-radius: 4px; font: 14px "Songti SC", serif; display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<div class="hud" data-hud>
  <b>拍照测试</b>（替代场景，不是正式美术）<br>
  WASD 走动 · 拖动鼠标 转视角<br>
  <b>C</b> 或右键 拿起相机 · 单击/空格 快门 · 滚轮 焦段 · <b>B</b> 相册<br>
  取景时：<b>R</b> 横竖 · <b>V</b> 低角度 · <b>↑↓</b> 或 Shift+滚轮 曝光<br>
  相机：<button data-style="instant">即时成像</button><button data-style="rangefinder">胶片旁轴</button><br>
  时段：<button data-phase="day">白天</button><button data-phase="sunset">日落</button><br>
  <span id="pipe-info"></span>
</div>
<div class="toast"></div>
<script type="module" src="src/photo-test.js"></script>
</body>
</html>
